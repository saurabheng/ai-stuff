# Scheduled reminder to refresh profiles (FREE on GitHub Actions).
# This does NOT auto-submit anything. Because every step is human-in-the-loop,
# the cron job only *prepares* updated content and notifies you (via the job
# summary / an issue) so you can review and apply it. Fully automated posting
# would violate the target sites' Terms of Service.
name: profile-refresh-reminder

on:
  schedule:
    - cron: "0 9 * * 1"  # every Monday 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  prepare-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate update drafts
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/prepare_updates.py > updates.md || echo "Draft generation skipped" > updates.md

      - name: Open a reminder issue with the drafts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('updates.md') ? fs.readFileSync('updates.md', 'utf8') : 'No draft generated.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly profile refresh - ${new Date().toISOString().slice(0,10)}`,
              body: `Review these drafts, then update your profiles manually:\n\n${body}`
            });