[project]
name = "career-agents"
version = "0.1.0"
description = "Human-in-the-loop multi-agent career assistant (LangChain + LangGraph + MCP + free LLMs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-groq>=0.2.1",
    "langchain-google-genai>=2.0.4",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.5",
    "mcp>=1.2.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.48.0"]

[project.scripts]
career-agents = "career_agents.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
